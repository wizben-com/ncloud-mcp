[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ncloud-mcp"
version = "0.1.0"
description = "Local MCP server for NAVER Cloud services, starting with CLOVA Speech"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "ncloud-mcp contributors"}]
dependencies = ["mcp>=1.26,<2", "httpx>=0.28,<0.29", "pydantic>=2.12,<3"]

[project.scripts]
ncloud-mcp = "ncloud_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1", "mypy>=1.18,<2", "build>=1.3,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/ncloud_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
